[package]
name = "address-registry"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "A machine-readable registry of Cardano scripts, keyed by payment credential"

[dependencies]
address-registry-schema = { path = "../address-registry-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
