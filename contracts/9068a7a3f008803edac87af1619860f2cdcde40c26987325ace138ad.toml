# jpg.store V1. The label is the compiled table's own rendering,
# `"{marketplace} {purpose}"`.
#
# ONE SCRIPT, TWO USES. The sale escrow (`addr1z…`) and the collection-offer
# contract (`addr1x…`) share this payment credential under two delegation forms,
# and the old registry recorded them in two tables that disagreed about the
# category because each saw one form. Both are true: the form is what tells them
# apart, which is why each use names its own address.
credential = "9068a7a3f008803edac87af1619860f2cdcde40c26987325ace138ad"

[[use]]
category = "marketplace"
purpose = "sale"
market = "jpg.store"
label = "JPG.store Sale"
source = "shared-crates/address-registry, PAYMENT_CREDENTIAL_REGISTRY (JPG.store, Sale, V1)"

